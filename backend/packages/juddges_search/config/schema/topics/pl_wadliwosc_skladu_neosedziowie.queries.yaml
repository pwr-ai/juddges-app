topic: pl_wadliwosc_skladu_neosedziowie
collection:
  name: "Zarzut wadliwej obsady sądu — sędziowie powołani na wniosek KRS po 2017 r. (2019-2026)"
  description: "Orzeczenia sądów powszechnych i administracyjnych (WSA, NSA), w których rozpoznano zarzut nieważności postępowania z powodu udziału sędziego powołanego na wniosek KRS ukształtowanej ustawą z 8.12.2017, wniosek o wyłączenie takiego sędziego lub test niezależności. Poza zakresem: inne przyczyny wadliwej obsady (pokrewieństwo, delegacja, ławnicy), sprawy z odwołań od uchwał KRS bez oceny składu orzekającego. Sąd Najwyższy NIE występuje w pełnym korpusie (Weaviate v2) — orzeczenia SN mogą być dostępne tylko w korpusie kuratorowanym (SQL poniżej) lub wymagają osobnego pozyskania z sn.pl."
  jurisdiction: PL
  period: {from: 2019-01-01, to: 2026-11-24}
  size_estimate: "unknown; rząd wielkości tysięcy orzeczeń (zarzut podnoszony seryjnie w apelacjach i skargach kasacyjnych, wnioski o wyłączenie od 2020 r.); oszacować po zsumowaniu unii zapytań"
  rationale: "Okres obejmuje TSUE A.K. (19.11.2019), uchwałę SN BSA I-4110-1/20 (23.01.2020), wyroki ETPCz 2021-2023, test niezależności po ustawie z 9.03.2023 i wyrok TSUE C-521/21 (24.03.2026), który dzieli okres na przed/po (automatyzm vs ocena całościowa)."

