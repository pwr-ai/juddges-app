curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date >= DATE '2019-01-01'
    AND (
      full_text ~* '(379\s*pkt\s*4|439\s*§\s*1\s*pkt\s*2|183\s*§\s*2\s*pkt\s*4)'
      OR full_text ~* '(neo-?\s*KRS|neosędzi|BSA\s*I-4110-1/20|Reczkowicz|Dolińska-Ficek|Advance Pharma|C-585/18|C-487/19|C-521/21|test\w* niezależności)'
    )
    AND full_text ~* '(Krajow\w* Rad\w* Sądownictwa|neo-?\s*KRS)'
    AND full_text ~* '(8 grudnia 2017|wadliw\w* (powołan|obsad|skład)|nienależycie obsadzon|sprzeczn\w* z przepisami prawa|neosędzi)'
  ORDER BY decision_date;
# Uwaga: korpus kuratorowany może zawierać orzeczenia SN (court_level), których brak w Weaviate v2.

filters:
  case_number_patterns: ["I ACa", "I Ca", "II Ca", "II AKa", "II Ka", "IV Ka", "I ACz", "I Co", "II GSK", "I OSK", "II OSK", "I FSK", "II FSK", "I GSK", "III OSK", "II SA", "I SA", "III SA"]
  courts:
    - "Naczelny Sąd Administracyjny"
    - "wojewódzkie sądy administracyjne"
    - "sądy apelacyjne (wydziały cywilne i karne)"
    - "sądy okręgowe jako sądy odwoławcze"
    - "Sąd Najwyższy — NIE w korpusie v2 (signatures: I CSK, II CSKP, I KZP, II KK, BSA, III PO, I NO); tylko korpus kuratorowany / osobne pozyskanie"

inclusion_gate: {field: wadliwosc_skladu_dotyczy, keep: [tak]}
negative_markers:
  - "wyłączenie sędziego z mocy ustawy z powodu pokrewieństwa"
  - "sędzia delegowany" # gdy brak wątku KRS
  - "ławnik"
  - "skład jednoosobowy zamiast trzyosobowego"
  - "odwołanie od uchwały Krajowej Rady Sądownictwa" # sprawy II GOK — status kandydata, nie składu
  - "postępowanie dyscyplinarne wobec sędziego"
  - "Krajowa Rada Sądownictwa" # jedyne wystąpienie w kontekście opinii o kandydacie/asesorze

analyses:
  - "Odsetek uwzględnionych zarzutów (rozstrzygniecie_zarzutu, skutek) kwartalnie 2019-2026, osobno dla sądów powszechnych i administracyjnych oraz rodzaj_sprawy."
  - "Pre/post 24.03.2026 (C-521/21): przesunięcie automatyzm_czy_ocena_indywidualna od 'automatyzm_wadliwosci' do 'ocena_indywidualna'; zmiana zestawu kryteria_oceniane."
  - "Linia orzecznicza: stosunek_do_bsa_i_4110_1_20, stosunek_do_etpcz i stosunek_do_c_521_21 po sądach apelacyjnych i izbach NSA."
  - "Kto i jakim instrumentem podnosi zarzut (kto_podnosi x instrument) oraz skuteczność wniosków o wyłączenie vs zarzutów apelacyjnych."
  - "Wpływ rodzaj_powolania (pierwsze powołanie vs awans) i skarb_panstwa_strona na wynik zarzutu."
