[project]
name = "juddges"
version = "1.5.30"
description = "Juddges App - AI-powered judicial decision search for Polish and UK courts"
authors = [{ name = "Lukasz Augustyniak", email = "aisolutions@lukaszaugustyniak.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "uvicorn>=0.23.2,<0.55.0",
    "gunicorn>=23,<27",
    "langserve[server]>=0.3.2,<0.4",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.14,<2",
    "juddges-search",
    "schema-generator-agent",
    "research-agent",
    "juddges-mcp",
    # Exact pin below 2.x: mcp>=2 requires sse-starlette>=3, which conflicts with
    # langserve[server] (sse-starlette<2). Do not bump until LangServe lifts that cap.
    "mcp==1.30.0",
    "langfuse>=3.2.3,<4",
    "aiohttp>=3.11.14,<4",
    "httpx>=0.27,<0.29",
    "supabase>=2.20.0,<3",
    "langgraph-checkpoint-postgres>=3.1.3,<4",
    "psycopg-binary>=3.2.10,<4",
    "celery[redis]>=5.5.3,<6",
    "werkzeug>=3.1.3,<4",
    "slowapi>=0.1.9,<0.2",
    "redis>=5.2,<7.0",
    "pydantic>=2.11.7,<3.0.0",
    "litellm>=1.78.0,<2.0.0,!=1.107.0",  # 1.107.0 was a compromised PyPI release (2026-10-21)
    "pandas>=2.2,<4.0",
    "openpyxl>=3.1.0,<4",
    "strawberry-graphql[fastapi]>=0.291.3,<0.337.0",
    "cachetools>=5.5,<8.0",
    "defusedxml>=0.7.1,<0.8",
    "email-validator>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
observability = ["sentry-sdk[fastapi]>=2.0.0,<3"]

[dependency-groups]
dev = [
    "langchain-cli>=0.0.36",
    "jupyterlab>=4.3.6,<5",
    "ruff>=0.11,<0.18",
    "pytest>=8.3.4,<9",
    "pytest-asyncio>=0.24,<1.5",
    "pytest-cov>=6,<8",
    # Randomises test order so order-dependent tests fail loudly instead of
    # passing by accident. Without it the suite ran in declared order every
    # time, in CI too, making that whole class of bug undetectable here.
    "pytest-randomly>=3.15,<6",
    "poethepoet>=0.29,<0.50",
    "mypy>=1.19.1,<3.0.0",
    "radon>=6.0.1,<7",
    "vulture>=2.15,<3",
]

# The root project is itself a package (editable install of `app/`, like
# Poetry's root install), so `app` is importable from any working directory --
# the workspace packages import `app` as well. uv syncs the `dev` group by
# default, matching `poetry install --with dev`.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
juddges-search = { workspace = true }
schema-generator-agent = { workspace = true }
research-agent = { workspace = true }
juddges-mcp = { workspace = true }

[tool.uv.build-backend]
# The distribution is `juddges`, but the import package is `app/` at the
# project root (no src/ layout).
module-name = "app"
module-root = ""

[tool.poe.tasks]
# Test commands
test = "pytest tests/ -v"
test-local = { cmd = "pytest -q -rN", env = { JUDDGES_PYTEST_PROFILE = "local" } }
test-unit = "pytest tests/ -v -m unit"
test-integration = "pytest tests/ -v -m integration"
test-local-integration = { cmd = "pytest -q -rN", env = { JUDDGES_PYTEST_PROFILE = "local", RUN_INTEGRATION_TESTS = "1" } }
test-local-ai = { cmd = "pytest -q -rN", env = { JUDDGES_PYTEST_PROFILE = "local", RUN_AI_TESTS = "1" } }
test-local-legacy = { cmd = "pytest -q -rN", env = { JUDDGES_PYTEST_PROFILE = "local", RUN_LEGACY_SCHEMA_API_TESTS = "1" } }
test-local-legacy-schema-api = { cmd = "pytest -q -rN tests/app/schemas_extraction", env = { JUDDGES_PYTEST_PROFILE = "local", RUN_LEGACY_SCHEMA_API_TESTS = "1", RUN_REMOVED_LEGACY_SCHEMA_API_TESTS = "1" } }
test-cov = "pytest tests/ -m unit --cov=app --cov=juddges_search --cov=schema_generator_agent --cov-report=html --cov-report=term-missing --cov-fail-under=54"
test-cov-html = "pytest tests/ -m unit --cov=app --cov=juddges_search --cov=schema_generator_agent --cov-report=html"

# Code quality commands
lint = "ruff check ."
lint-fix = "ruff check . --fix"
format = "ruff format ."
format-check = "ruff format . --check"

# Combined commands
check = ["lint", "format-check"]
# check-all mirrors CI (`pytest -m unit`) so it can be run locally without
# requiring Supabase, Redis, or OpenAI. Use `test-integration` for the live
# suite and `test` for the full set when those services are available.
check-all = ["lint", "format-check", "test-unit"]
ci = ["lint", "format-check"]

# Search benchmark (live backend required — see scripts/search_benchmark.py)
bench-search = "python scripts/search_benchmark.py"

# Local MCP server over stdio; needs JUDDGES_MCP_KEY and service-role credentials
mcp-stdio = "python -m juddges_mcp.stdio"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
console_output_style = "count"
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore:'enablePackrat' deprecated - use 'enable_packrat':DeprecationWarning:pyiceberg\\.expressions\\.parser",
    "ignore:'escChar' argument is deprecated, use 'esc_char':DeprecationWarning:pyiceberg\\.expressions\\.parser",
    "ignore:'unquoteResults' argument is deprecated, use 'unquote_results':DeprecationWarning:pyiceberg\\.expressions\\.parser",
    "ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated.*:DeprecationWarning:pyiceberg\\.table\\.metadata",
    "ignore:The 'timeout' parameter is deprecated\\.:DeprecationWarning:supabase\\._sync\\.client",
    "ignore:The 'verify' parameter is deprecated\\.:DeprecationWarning:supabase\\._sync\\.client",
    "ignore:The 'warn' method is deprecated, use 'warning' instead:DeprecationWarning:slowapi\\.extension",
    "ignore:validate_yaml_schema\\(\\) needs refactoring\\..*:PendingDeprecationWarning:juddges_search\\.info_extraction\\.extractor",
]
markers = [
    "ai: marks tests that require a live LLM or API key",
    "api: marks API boundary tests",
    "auth: marks authentication and authorization tests",
    "collections: marks collection management tests",
    "db: marks database-contract tests (need a throwaway Postgres, never Supabase)",
    "e2e: marks tests that require a live deployed application stack",
    "integration: marks tests as integration tests (require external services)",
    "legacy: marks tests for deprecated API surfaces",
    "performance: marks opt-in performance tests",
    "schemas: marks schema management tests",
    "search: marks search functionality tests",
    "security: marks security-related tests",
    "slow: marks slow-running tests",
    "timing: marks tests that measure timing-sensitive behavior",
    "unit: marks tests as unit tests (no external services)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "C4", "SIM", "RET", "PTH", "PERF", "B", "S", "RUF", "TC", "FA"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # assert usage (needed in tests)
    "B008",   # function call in default arg (FastAPI Depends pattern)
    "B904",   # raise from in except (TODO: fix incrementally)
    "PTH123", # open() vs Path.open() (style preference)
    "S311",   # random module (non-security uses are fine)
    "PERF401", # list comprehension (TODO: fix incrementally)
    "S110",    # try-except-pass (TODO: add logging incrementally)
    "RUF012",  # mutable class variable (Pydantic models use this pattern)
    "S608",    # SQL string concat (only in admin scripts)
    "PTH118",  # os.path.join (sys.path manipulation needs os.path)
    "PTH120",  # os.path.dirname (sys.path manipulation needs os.path)
    "S314",    # XML parsing (xml_converter uses defusedxml)
    "UP042",   # str+Enum -> StrEnum (TODO: migrate incrementally; ruff 0.16)
    "S104",    # bind all interfaces (intentional for Docker)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "S106", "SIM102", "RUF059"]
"scripts/**/*.py" = ["S608"]
"examples/**/*.py" = ["S113"]
# LLM-facing prompt uses en dashes for date ranges (PL/EN typographic convention).
"app/extraction_domain/nl_filter_generator.py" = ["RUF001"]
# Pins the prompt's literal en-dash date-range phrasing (e.g. "2015–2024").
"tests/app/test_nl_filter_prompt_contract.py" = ["RUF001"]

[tool.coverage.run]
source = ["app", "juddges_search", "schema_generator_agent"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Raise from the previous 50% gate. Set slightly below measured coverage
# so CI stays green while preventing backsliding.
fail_under = 54
show_missing = true
skip_covered = false

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
