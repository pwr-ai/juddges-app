[project]
name = "research_agent"
version = "0.1.0"
description = "Legal Research Agent - autonomous multi-step legal research with tool-using LangGraph agent"
authors = [{ name = "Lukasz Augustyniak", email = "aisolutions@lukaszaugustyniak.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain-openai>=1.1.14,<2",
    "langchain-core>=1.2.22,<2",
    "langgraph>=1.0.10,<2",
    "juddges-search",
    "loguru",
    "pydantic>=2.11.7,<3.0.0",
]

[tool.uv.sources]
juddges-search = { workspace = true }

# No [dependency-groups] here: dev tooling (pytest, ruff, ...) lives in the
# workspace root's `dev` group. uv resolves every member's groups into the one
# backend/uv.lock, and the old per-package Poetry dev pins (never installed by
# the root `poetry install`) conflicted with the root's.

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
minversion = "8.0.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
