name: Performance Tests

on:
  # Frontend bundle analysis only, on the weekly cron and manual dispatch.
  # The backend perf job was removed: it needs real SUPABASE_* secrets and a
  # live DB, which this repo does not configure, so it failed on every run.
  # Run backend/tests/performance/ locally instead (see
  # docs/reference/performance-quick-reference.md).
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:

jobs:
  frontend-performance:
    name: Frontend Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run bundle analysis
        working-directory: frontend
        run: |
          node scripts/analyze-bundle.js || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-frontend
          path: |
            frontend/.next/build-manifest.json
