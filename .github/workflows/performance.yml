name: Performance Tests

on:
  # No `pull_request:` trigger — the backend perf job needs real SUPABASE_*
  # secrets (currently unset in this repo) and a live DB, so PR runs always
  # fail at module-import or first request. PR #197 attempted a one-line
  # BACKEND_API_KEY patch and was abandoned for the same reason. Perf tests
  # now run only on the weekly cron and via manual dispatch.
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      load_test_users:
        description: 'Number of users for load test'
        required: false
        default: '50'
      load_test_duration:
        description: 'Load test duration (e.g., 2m, 5m)'
        required: false
        default: '2m'

jobs:
  backend-performance:
    name: Backend Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - id: python
        name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Restores the uv cache only; cache-warm.yml is the one workflow that saves
      # it. Inputs must match there exactly, or the cache key differs.
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          save-cache: false

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --locked

      - name: Run pytest performance tests
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # app/auth.py raises at import time when BACKEND_API_KEY is unset,
          # which blocks pytest collection of tests/performance/test_search_performance.py
          # (it imports app.server). The test hardcodes the header value
          # "X-API-Key: test-key", so we mirror that here rather than wiring in
          # a real secret - the perf job exercises in-process ASGI calls, not
          # an authenticated remote backend.
          BACKEND_API_KEY: test-key
        run: |
          uv run pytest tests/performance/ --performance -v -s --tb=short

      - name: Upload performance results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-results-backend
          path: |
            backend/tests/performance/*.html
            backend/tests/performance/*.csv
            performance_results.json

  frontend-performance:
    name: Frontend Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run bundle analysis
        working-directory: frontend
        run: |
          node scripts/analyze-bundle.js || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: performance-results-frontend
          path: |
            frontend/.next/build-manifest.json
