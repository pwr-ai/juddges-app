curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date >= DATE '2022-01-01'
    AND (
      full_text ~* '\mWIBOR'
      OR array_to_string(keywords, ' ') ~* 'wibor'
      OR array_to_string(legal_topics, ' ') ~* 'wibor'
    )
    AND (
      full_text ~* '(385\s*\(?\s*1|385¹|niedozwolon|abuzywn|zmienn\w* oprocentowan|wskaźnik\w* referencyjn|2016/1011|C-471/24)'
      OR array_to_string(cited_legislation, ' ') ~* '(385|2016/1011)'
    )
    AND NOT (full_text ~* '\m(CHF|frank\w* szwajcarsk)' AND full_text !~* 'kredyt\w* (złotow|w PLN|w złotych)')
  ORDER BY decision_date;

filters:
  case_number_patterns: ["I C", "XXVIII C", "I Ca", "I ACa", "V ACa", "XXVII Ca", "I Cz", "I ACz", "XXVIII Cz", "C upr"]
  courts:
    - "Sąd Okręgowy w Warszawie (XXVIII Wydział Cywilny)"
