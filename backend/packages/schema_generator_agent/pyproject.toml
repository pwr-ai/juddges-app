[project]
name = "schema_generator_agent"
version = "0.1.0"
description = "Agentic system enabling automated schema generation for structured information extraction"
authors = [{ name = "Lukasz Augustyniak", email = "aisolutions@lukaszaugustyniak.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.0.0,<2",
    "langchain-openai>=1.1.14,<2",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.22,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.0.10,<2",
    "langgraph-checkpoint-postgres>=3.1.3,<4",
    "psycopg-binary>=3.2.10,<4",
    "juddges-search",
]

[tool.uv.sources]
juddges-search = { workspace = true }

# No [dependency-groups] here: dev tooling (pytest, ruff, ...) lives in the
# workspace root's `dev` group. uv resolves every member's groups into the one
# backend/uv.lock, and the old per-package Poetry dev pins (never installed by
# the root `poetry install`) conflicted with the root's.

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
untyped_calls_exclude = ["pymongo"]
plugins = "numpy.typing.mypy_plugin"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "datasets.*", "sentence_transformers.*"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0.0"
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
