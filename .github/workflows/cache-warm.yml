name: Cache Warm

# The only workflow that saves dependency caches. Every other job uses
# `actions/cache/restore`, or setup-uv with `save-cache: false`, so caches are
# written once, in the `main` scope, which every pull request can read. Before
# this, each PR saved its own ~300 MB npm and ~600 MB Python dependency copies
# under `refs/pull/<n>/merge`, and the duplicates kept the repo pinned at the
# 10 GB cache limit.
#
# The keys, paths and setup-uv inputs below must match the restore steps in
# ci.yml, performance.yml and search-integration.yml exactly -- the cache key
# hashes them, so a mismatch is a silent miss.

on:
  push:
    branches: [main]
    paths:
      - backend/uv.lock
      - frontend/package-lock.json
      - .github/workflows/cache-warm.yml
  schedule:
    # Weekly, so the entries outlive GitHub's 7-day eviction on quiet weeks.
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  uv:
    name: Warm uv cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The only setup-uv step that saves. setup-uv skips the save when the
      # key already exists, so an unchanged uv.lock costs a restore, not an
      # upload. Every input except save-cache must match the restore steps.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          save-cache: true

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

  npm:
    name: Warm npm cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - id: restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          lookup-only: true

      - name: Install dependencies
        if: steps.restore.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
