curated_sql: |
  SELECT j.id, j.case_number, j.court_name, j.decision_date
  FROM public.judgments j
  WHERE j.id IN (
          SELECT m.judgment_id FROM public.reasoning_line_members m
          WHERE m.reasoning_line_id = 'e2fbd45e-e9f8-4588-bc21-f7ed6eb12c5b'
        )
  UNION
  SELECT j.id, j.case_number, j.court_name, j.decision_date
  FROM public.judgments j
  WHERE j.jurisdiction = 'PL'
    AND j.decision_date BETWEEN DATE '2025-01-01' AND DATE '2026-11-24'
    AND j.full_text ~* '(franka?\s+szwajcarsk|\mCHF\M)'
    AND (
          j.full_text ~* '(przedawni|zatrzymani|potrąceni|wynagrodzeni[ae]\s+za\s+korzystanie|marż[aąy]|III\s+CZP\s+8/26|C-75[23]/24|C-901/24|C-26[12]/25|C-902/24|zabezpieczeni)'
    )
  ORDER BY decision_date;

filters:
  case_number_patterns: ["I C", "XXVIII C", "XXVIII Cz", "I ACa", "V ACa", "VI ACa", "I ACz", "II C", "XV C", "I Co"]
  courts:
    - "Sąd Okręgowy w Warszawie"   # XXVIII Wydział Cywilny (frankowy)
