topic: pl_cudzoziemcy_bezczynnosc_wojewody
collection:
  name: "Bezczynność wojewodów w sprawach legalizacji pobytu cudzoziemców (WSA/NSA 2022–2026)"
  description: "Wyroki i postanowienia WSA (II SAB/...) oraz NSA (II OSK/...) w sprawach skarg na bezczynność lub przewlekłość wojewodów i Szefa UdSC w sprawach zezwoleń na pobyt czasowy, stały, rezydenta długoterminowego UE, Karty Pobytu i zezwoleń na pracę. Poza zakresem: skargi na merytoryczne decyzje odmowne, ochrona międzynarodowa, zobowiązanie do powrotu, bezczynność w innych kategoriach spraw."
  jurisdiction: PL
  period: {from: 2022-01-01, to: 2026-11-24}
  size_estimate: "rzędu kilku–kilkunastu tysięcy orzeczeń (szacunek: sprawozdania WSA wskazują setki–tysiące skarg rocznie na bezczynność wojewodów w sprawach cudzoziemców, zwłaszcza WSA Wrocław, Poznań, Gliwice, Warszawa, Kraków); 15 zapytań × 50 da kilkaset unikalnych kandydatów — kolekcję należy uzupełniać zapytaniami per WSA i per rok"
  rationale: "Od 2022 r. (napływ po agresji Rosji na Ukrainę, wzrost wniosków pracowniczych) skala zaległości i skarg gwałtownie wzrosła; okres obejmuje też zmiany z 2025 r. (wnioski przez MOS, nowa ustawa o zatrudnianiu cudzoziemców), co pozwala na porównanie przed/po."

