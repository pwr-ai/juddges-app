curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date BETWEEN DATE '2022-01-01' AND DATE '2026-11-24'
    AND (
      full_text ~* '178\s*a\s*§\s*[14]'
      OR full_text ~* 'art\.?\s*178a'
      OR EXISTS (SELECT 1 FROM unnest(cited_legislation) c WHERE c ~* '178\s*a')
      OR EXISTS (SELECT 1 FROM unnest(keywords) k WHERE k ~* 'nietrzeźwo|stan(ie)? nietrzeźwości|prowadzenie pojazdu')
    )
    AND full_text ~* '(nietrzeźwo|środka odurzającego)'
    AND COALESCE(case_number, '') !~* '\m(W|Kow|Ko)\M'
  ORDER BY decision_date;

filters:
  case_number_patterns: ["II K", "III K", "IV K", "VII K", "XIV K", "II Ka", "IV Ka", "V Ka", "VI Ka", "IX Ka", "XI Ka"]
  courts: ["Sąd Rejonowy (wydziały karne — I instancja)", "Sąd Okręgowy (wydziały karne odwoławcze — Ka)"]
  exclude_case_number_patterns: ["W", "Kow", "Ko", "Kp", "C", "Ca"]

inclusion_gate: {field: wymiar_kary_178a_dotyczy, keep: [tak]}
negative_markers:
  - "art. 87 § 1 k.w."
  - "art. 87 § 1a k.w."
  - "stanie po użyciu alkoholu"
  - "obwiniony"
  - "art. 177 § 2 k.k. w zw. z art. 178 § 1 k.k."
  - "regres ubezpieczyciela"
  - "art. 43 pkt 1 lit. a ustawy o ubezpieczeniach obowiązkowych"
  - "o zatarcie skazania"
  - "skrócenie okresu zakazu art. 84 k.k."
  - "uniewinnia oskarżonego"

analyses:
  - "Pre/post 14.03.2024 and 29.01.2026: share of judgments with przepadek_pojazdu (pojazd / równowartość / nawiązka / wyjątkowy wypadek) per stezenie bucket (<1,0; 1,0-1,49; >=1,5 promila), only for czyn committed after the cut-off."
  - "Pre/post 1.10.2023: distribution of rodzaj_kary for § 1 (grzywna via art. 37a vs pozbawienie wolności z warunkowym zawieszeniem vs bezwzględne), and median kara_pozbawienia_wolnosci_miesiace."
  - "Regression of zakaz_prowadzenia_lata and swiadczenie_pieniezne_zl on stezenie_wartosc (normalized: mg/dm3 x ~2.1 = promile), przeslanki_par_4 and skutek_zdarzenia; regional variation by apelacja/court."
  - "Appellate outcome rate (wynik_odwolawczy) by zarzut_razacej_niewspolmiernosci — how often Ka courts change the penalty and in which direction."
  - "Cross-lingual: PL vs UK disqualification length and custody/suspension rates for comparable alcohol levels and recidivism (see uk_side.field_mapping)."

uk_side:
  notes: >-
    UK curated corpus is mostly Court of Appeal (Criminal Division) sentencing appeals. Plain drink driving
    (Road Traffic Act 1988 s.5 excess alcohol; s.4 unfit through drink or drugs; s.5A specified drug limits;
    s.7(6) failing to provide a specimen) is summary-only and sentenced in magistrates' courts under the
    Sentencing Council 'Excess alcohol (drive/attempt to drive)' guideline (disqualification minimum 12 months,
    RTOA 1988 s.34(1); 3 years for a second relevant offence within 10 years, s.34(3)), so it rarely reaches the
    CACD and is not eligible for an unduly lenient sentence reference (CJA 1988 s.36 covers indictable-only and
    specified either-way offences). Expect UK hits mainly for s.3A (causing death by careless driving when under
    the influence), s.1 (causing death by dangerous driving) with alcohol as an aggravating factor, and appeals
    against the length of disqualification (incl. extension periods under RTOA 1988 s.35A). Vehicle
    deprivation orders: Sentencing Act 2020 s.153 (closest analogue of przepadek pojazdu). Suspended sentences:
    Sentencing Act 2020 s.264/s.277; the Sentencing Act 2026 (c.2, Royal Assent 22.01.2026) adds a presumption
    that custodial terms of 12 months or less are suspended, in force for convictions on or after 22.03.2026
    [?: commencement date from a Sentencing Council notice, not checked on legislation.gov.uk].
  curated_sql: |
    SELECT id, case_number, court_name, decision_date
    FROM public.judgments
    WHERE jurisdiction = 'UK'
      AND decision_date BETWEEN DATE '2022-01-01' AND DATE '2026-11-24'
      AND (
        full_text ~* 'Road Traffic Act 1988'
        OR EXISTS (SELECT 1 FROM unnest(cited_legislation) c WHERE c ~* 'Road Traffic')
      )
      AND full_text ~* '(excess alcohol|over the (prescribed|legal) limit|drink[- ]driv|unfit through drink|under the influence|specimen of breath|microgrammes of alcohol|section 3A|s\.?\s?3A)'
    ORDER BY decision_date;
  field_mapping:
    - "wymiar_kary_178a_dotyczy <-> drink_drug_driving_applies"
    - "kwalifikacja_prawna <-> offence_provision (RTA 1988 s.5 / s.4 / s.5A / s.3A / s.1)"
    - "przeslanki_par_4 <-> previous_relevant_conviction_within_10_years (RTOA 1988 s.34(3))"
    - "stan_sprawcy <-> substance_type (alcohol / drug / both)"
    - "stezenie_wartosc + stezenie_jednostka <-> alcohol_reading + reading_unit (µg/100ml breath, mg/100ml blood; legal limit E&W 35 µg breath / 80 mg blood vs PL 0,25 mg/dm3 = 25 µg/100ml breath)"
    - "skutek_zdarzenia <-> collision_or_harm_caused"
    - "tryb_postepowania <-> plea_stage (guilty plea credit; no direct PL equivalent of art. 335/387, closest: early guilty plea)"
    - "rodzaj_kary <-> sentence_type (fine / community order / custody / suspended sentence order)"
    - "kara_pozbawienia_wolnosci_miesiace <-> custodial_term_months"
    - "warunkowe_zawieszenie <-> suspended_sentence_order"
    - "okres_proby_lata <-> operational_period_months (/12)"
    - "grzywna_stawki x grzywna_stawka_zl <-> fine_amount_gbp (band-based fines, no day-fine units)"
    - "zakaz_prowadzenia + zakaz_prowadzenia_lata <-> disqualification_type + disqualification_months (/12)"
    - "swiadczenie_pieniezne_zl <-> victim_surcharge_gbp (functional analogue only)"
    - "przepadek_pojazdu <-> vehicle_deprivation_order (Sentencing Act 2020 s.153)"
    - "okolicznosci_lagodzace / okolicznosci_obciazajace <-> mitigating_factors / aggravating_factors (Sentencing Council step 2)"
    - "zarzut_razacej_niewspolmiernosci <-> appeal_ground (manifestly excessive / unduly lenient reference)"
    - "wynik_odwolawczy <-> appeal_outcome (dismissed / sentence reduced / sentence increased on reference / quashed)"
