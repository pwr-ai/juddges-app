topic: pl_wymiar_kary_178a
collection:
  name: "Wymiar kary za jazdę w stanie nietrzeźwości (art. 178a k.k.) 2022-2026"
  description: "Wyroki sądów rejonowych (K, nakazowe) i okręgowych jako odwoławczych (Ka) skazujące lub warunkowo umarzające za art. 178a § 1 lub § 4 k.k., z uzasadnieniem wymiaru kary. Poza zbiorem: wykroczenia z art. 87 k.w. (W), art. 177 w zw. z art. 178 bez art. 178a, postępowania wykonawcze (Kow/Ko), sprawy cywilne o regres ubezpieczyciela."
  jurisdiction: PL+UK
  period: {from: 2022-01-01, to: 2026-11-24}
  size_estimate: "unknown; very large population (art. 178a is among the most frequent offences in district courts), but only a fraction is published with a uzasadnienie on the Portal Orzeczeń — expect a few thousand reachable via the union of the queries below (15 x 50 = 750 hits max per run; re-run per time slice)."
  rationale: "Start 2022 gives a pre-reform baseline; three reform cut-offs to compare: 1.10.2023 (ustawa z 7.07.2022: § 1 only imprisonment up to 3 years, art. 37a, art. 69 § 1 'up to 1 year'), 14.03.2024 (art. 44b + obligatory przepadek pojazdu in art. 178a § 5), 29.01.2026 (art. 44b § 1a, nawiązka 5 000-500 000 zł instead of przepadek równowartości). Only ordinary courts: SN is not in the full corpus; administrative courts do not try offences."

