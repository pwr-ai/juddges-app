topic: pl_oze_wiatraki_planowanie
collection:
  name: "Lokalizacja OZE a planowanie przestrzenne (WSA/NSA 2020–2026)"
  description: "Orzeczenia WSA i NSA w sporach o lokalizację elektrowni wiatrowych, farm fotowoltaicznych i biogazowni: uchwały MPZP/ZPI/plan ogólny/studium, rozstrzygnięcia nadzorcze, decyzje środowiskowe, WZ, pozwolenia na budowę. Poza zakresem: podatek od nieruchomości od wiatraków, sprawy taryfowe/URE, dotacje, mikroinstalacje bez sporu planistycznego."
  jurisdiction: PL
  period: {from: 2020-01-01, to: 2026-11-24}
  size_estimate: "unknown; szacunkowo 1–3 tys. orzeczeń (wiele spraw PV/WZ i decyzji środowiskowych dla farm PV od 2020 r.; sprawy wiatrowe rzadsze do 2023 r.) — 15 zapytań × 50 daje do ~750 kandydatów przed deduplikacją"
  rationale: "2020 obejmuje boom PV i ostatnie lata 10H; pozwala porównać okres przed/po nowelizacji ustawy wiatrakowej (2023: 700 m), przed/po reformie planowania (7.07.2023: plan ogólny, ZPI) oraz przed/po wyroku NSA II OSK 7/26 (15.04.2026)."

search_v2:
