    body: {query: "uchwała w sprawie miejscowego planu zagospodarowania przestrzennego elektrownie wiatrowe stwierdzenie nieważności", court_type: [administrative_court], date_from: 2020-01-01, date_to: 2026-11-24, alpha: 0.3, limit: 50}
  - id: q02
    purpose: "Reguła 10H — ustawa o inwestycjach w zakresie elektrowni wiatrowych"
    body: {query: "art. 4 ustawy o inwestycjach w zakresie elektrowni wiatrowych odległość dziesięciokrotność wysokości elektrowni wiatrowej od budynku mieszkalnego", court_type: [administrative_court], date_from: 2020-01-01, date_to: 2026-11-24, alpha: 0.2, limit: 50}
  - id: q03
