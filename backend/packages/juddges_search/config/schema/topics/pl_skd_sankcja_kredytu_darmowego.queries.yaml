topic: pl_skd_sankcja_kredytu_darmowego
collection:
  name: "Sankcja kredytu darmowego (art. 45 u.k.k.) — sądy powszechne 2022–2026"
  description: "Wyroki sądów powszechnych (SR, SO, SA), w których sąd ocenia żądanie lub zarzut SKD z art. 45 ustawy o kredycie konsumenckim. Poza zakresem: zwrot prowizji przy wcześniejszej spłacie (art. 49) bez SKD, sprawy frankowe i WIBOR bez wątku art. 45, nakazy zapłaty bez uzasadnienia, kredyty hipoteczne."
  jurisdiction: PL+UK
  period: {from: 2022-01-01, to: 2026-11-24}
  size_estimate: "kilka tysięcy wyroków z uzasadnieniem w korpusie pl-court (szacunek: ~19,5 tys. pozwów w 2026 r. wg portali, z czego publikowana jest tylko część; unknown do czasu uruchomienia zapytań)"
  rationale: "Fala spraw SKD (w dużej mierze z powództwa cesjonariuszy) narasta od 2022 r.; okres obejmuje wyroki przed i po TSUE C-472/23 (13.02.2025), zawieszeniu SN III CZP 15/25 (30.07.2025) i TSUE C-744/24 (23.04.2026). SN i UK nie są w korpusie v2."

