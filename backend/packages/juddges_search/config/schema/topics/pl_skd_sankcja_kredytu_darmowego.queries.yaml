curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date BETWEEN DATE '2022-01-01' AND DATE '2026-11-24'
    AND (
          full_text ~* 'sankcj[aąięy]\s+kredytu\s+darmowego'
       OR full_text ~* 'art\.?\s*45\s+(ust\.?\s*\d\s+)?(u\.?k\.?k\.?|ustawy\s+o\s+kredycie\s+konsumenckim)'
       OR EXISTS (SELECT 1 FROM unnest(coalesce(keywords, '{}') || coalesce(legal_topics, '{}')) k
                  WHERE k ~* 'kredyt(u)? darmow')
       OR EXISTS (SELECT 1 FROM unnest(coalesce(cited_legislation, '{}')) c
                  WHERE c ~* 'kredycie konsumenckim' AND c ~* '(art\.?\s*45|art\.?\s*30)')
    )
  ORDER BY decision_date;

filters:
  case_number_patterns: ["I C", "II C", "XXV C", "XXVIII C", "I Ca", "II Ca", "V Ca", "XXVII Ca", "I ACa", "V ACa", "VI ACa", "VI C", "XVI C"]
