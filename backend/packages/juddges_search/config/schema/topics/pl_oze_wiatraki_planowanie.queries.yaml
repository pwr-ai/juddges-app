curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date BETWEEN '2020-01-01' AND '2026-11-24'
    AND (
      case_number ~* '(II\s*SA/|II\s*OSK|I\s*SA/|IV\s*SA/|II\s*OW)'
      OR court_name ~* 'administracyjny'
    )
    AND (
      full_text ~* '(elektrowni[a-ząę]* wiatrow|farm[a-ząę]* wiatrow|turbin[a-ząę]* wiatrow|fotowoltai|biogazowni|odnawialn[a-ząę]* źród[a-ząę]* energii)'
      OR array_to_string(keywords, ' ') ~* '(wiatrow|fotowoltai|biogaz|OZE)'
    )
    AND (
      full_text ~* '(planu? zagospodarowania przestrzennego|zintegrowan[a-ząę]* plan[a-ząę]* inwestycyjn|plan[a-ząę]* ogóln|studium uwarunkowań|warunk[a-ząę]* zabudowy|środowiskowych uwarunkowaniach|pozwoleni[a-ząę]* na budowę|rozstrzygnięci[a-ząę]* nadzorcz)'
      OR array_to_string(cited_legislation, ' ') ~* '(planowaniu i zagospodarowaniu|elektrowni wiatrowych|udostępnianiu informacji o środowisku)'
    )
  ORDER BY decision_date;

filters:
  case_number_patterns: ["II SA/", "II OSK", "IV SA/Wa", "I SA/Op 479/25", "II OSK 7/26"]
  case_symbols: ["6150 (miejscowy plan zagospodarowania przestrzennego) [?]", "6153 (warunki zabudowy) [?]", "6136 / 613x (ochrona środowiska, decyzje środowiskowe) [?]", "6014 (pozwolenie na budowę) [?]"]
  courts: ["Naczelny Sąd Administracyjny", "WSA w Opolu", "WSA w Warszawie", "WSA w Szczecinie", "WSA w Gdańsku", "WSA w Olsztynie", "WSA w Bydgoszczy", "WSA w Poznaniu", "WSA w Łodzi", "WSA w Lublinie", "WSA we Wrocławiu", "WSA w Białymstoku", "WSA w Gorzowie Wielkopolskim", "WSA w Rzeszowie", "WSA w Kielcach", "WSA w Krakowie", "WSA w Gliwicach"]

inclusion_gate: {field: oze_planowanie_dotyczy, keep: [tak]}
negative_markers:
  - "podatek od nieruchomości od elektrowni wiatrowej"
  - "wartość budowli elektrowni wiatrowej do opodatkowania"
  - "Prezes Urzędu Regulacji Energetyki taryfa"
  - "koncesja na wytwarzanie energii"
  - "mikroinstalacja na dachu budynku"
  - "dofinansowanie ze środków RPO / NFOŚiGW"
  - "linia elektroenergetyczna wysokiego napięcia (bez OZE)"

analyses:
  - "Odsetek stwierdzeń nieważności uchwał planistycznych dla wiatraków vs PV vs biogazowni, w podziale na skarżącego (mieszkańcy, wojewoda, inwestor)."
  - "Przed/po 23.04.2023 (nowelizacja wiatrakowa) i przed/po reformie planowania z 7.07.2023: zmiana rozkładu regula_odleglosciowa, odleglosc_od_zabudowy_m i instrument_planistyczny."
  - "Linia ZPI: zpi_dla_wiatrakow i stosunek_do_ii_osk_7_26 w czasie — czy WSA po 15.04.2026 dostosowują się do NSA."
  - "Ranking zarzutów (zarzuty) skutecznych vs nieskutecznych: łączenie z podstawa_wadliwosci i wynik_dla_inwestycji."
  - "Geografia: WSA (z sygnatury) × typ_instalacji × wynik_dla_inwestycji — regiony najbardziej sporne dla OZE."
