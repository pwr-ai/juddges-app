topic: kwalifikacja_umowy_stosunek_pracy
collection:
  name: "Kwalifikacja umowy: umowa cywilnoprawna a stosunek pracy (PL + UK employment status)"
  description: "PL: sprawy sądów pracy i ubezpieczeń społecznych (SR/SO/SA), w których sąd ocenia, czy umowa zlecenia, o dzieło, B2B lub kontrakt menedżerski jest stosunkiem pracy (art. 22 k.p., art. 189 i 63¹ k.p.c.) albo czy umowa o dzieło jest w istocie umową o świadczenie usług dla celów ubezpieczeń społecznych (decyzje ZUS), plus sprawy podatkowe WSA/NSA o kryteria działalności gospodarczej (art. 5b u.p.d.o.f.). UK: rozstrzygnięcia o statusie employee/worker/self-employed. Poza zakresem: spory z bezspornej umowy o pracę, pozorne umowy o pracę zawierane dla świadczeń, spory o zapłatę między przedsiębiorcami."
  jurisdiction: PL+UK
  period: {from: 2015-01-01, to: 2026-11-24}
  size_estimate: "unknown; rough guess several thousand PL candidates in the full corpus (each search_v2 query returns max 50, so the union of ~16 queries yields at most ~800 candidates per run — widen with further time slices if recall is insufficient). Curated: likely tens PL and tens UK."
  rationale: "Od 8.07.2026 nowy tryb: decyzja OIP przekształcająca umowę i odwołanie do sądu pracy (q17) — kolejny punkt cięcia pre/post. Od 2015 r. pełne pokrycie portali orzeczeń sądów powszechnych; obejmuje okres przed i po Uber v Aslam (19.02.2021), IWGB v CAC (21.11.2023), dyrektywie (UE) 2024/2831 (23.10.2024) i Employment Rights Act 2025 (Royal Assent 18.12.2025), co pozwala porównywać linię orzeczniczą przed/po. SN nie jest w korpusie pełnym — jego linia jest widoczna przez powołania w orzeczeniach SO/SA (pole orzeczenia_powolane)."

