[project]
name = "juddges_search"
version = "0.1.0"
description = "Juddges project search - AI-powered judicial decision search"
authors = [{ name = "Lukasz Augustyniak", email = "aisolutions@lukaszaugustyniak.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.14,<2",
    "termcolor>=2.5.0,<3",
    "loguru>=0.7.3,<0.8",
    "jinja2>=3.1.6,<4",
    "python-dotenv>=1.0.0,<2",
    "langfuse>=3.2.3,<4",
    "rich>=14.1.0,<16",
    "celery[redis]>=5.5.3,<6",
    "jsonschema>=4.23.0,<5",
    "pyyaml>=6.0.2,<7",
]

# No [dependency-groups] here: dev tooling (pytest, ruff, ...) lives in the
# workspace root's `dev` group. uv resolves every member's groups into the one
# backend/uv.lock, and the old per-package Poetry dev pins (never installed by
# the root `poetry install`) conflicted with the root's.

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Pin to ruff's pre-0.16 default rule set; the expanded 0.16 defaults
# (BLE, TRY, DTZ, FURB, ...) flag existing code. TODO: adopt incrementally.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"]

[tool.langserve]
export_module = "juddges_search"
export_attr = "chain"
