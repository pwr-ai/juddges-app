analyses:
  - "Odsetek wynik_skd=skd_zastosowana_* w podziale na okresy: przed 13.02.2025 / 13.02.2025–22.04.2026 / od 23.04.2026 (C-472/23, C-744/24), osobno dla ocena_odsetek_od_kosztow_kredytowanych."
  - "Rozkład standard_oceny_naruszenia (każde vs istotne vs test C-472/23) w czasie i wg sądu okręgowego — mapa rozbieżności linii orzeczniczej."
  - "Konsument vs cesjonariusz (powod_typ): skuteczność, częstość zarzutu nadużycia prawa i ocena_cesji."
  - "Najczęstsze naruszenia_stwierdzone wg pozwany_typ (bank vs instytucja pożyczkowa) i rodzaj_kredytu; mediana kwota_zasadzona_pln / calkowita_kwota_kredytu_pln."
  - "stosunek_do_c_744_24 po 23.04.2026: stosuje vs odróżnia vs polemizuje, wg instancji."

uk_side:
  topic: "UK motor finance — undisclosed / hidden commission and unfair relationship (s.140A–140C Consumer Credit Act 1974)"
  notes: "Johnson v FirstRand Bank Ltd [2025] UKSC 33 (1.08.2025; joined with Wrench and Hopcraft) — UKSC rejected fiduciary/bribery liability of car dealers but held the credit relationship in Johnson unfair under s.140A (undisclosed commission, commercial tie), remedy under s.140B. Venues: County Court, High Court (KBD/Commercial Court), Court of Appeal; also FOS complaints and the FCA redress scheme (not court judgments). Terms: 'unfair relationship', 'discretionary commission arrangement', 'secret/half-secret commission', 'commercial tie', 'APR', 'total charge for credit'. Same economic core as SKD: undisclosed or misrepresented credit cost; very different remedy (court-discretionary s.140B vs automatic loss of interest under art. 45)."
  curated_sql: |
    SELECT id, case_number, court_name, decision_date
    FROM public.judgments
    WHERE jurisdiction = 'UK'
      AND decision_date BETWEEN DATE '2015-01-01' AND DATE '2026-11-24'
      AND (
            full_text ~* '(section|s\.)\s*140[ABC]'
         OR full_text ~* 'unfair\s+relationship'
         OR EXISTS (SELECT 1 FROM unnest(coalesce(cited_legislation, '{}')) c WHERE c ~* 'Consumer Credit Act 1974')
      )
      AND full_text ~* '(commission|total charge for credit|\mAPR\M|credit broker|motor finance|hire purchase)'
    ORDER BY decision_date;
  field_mapping:
    - "skd_dotyczy <-> unfair_relationship_applies"
    - "naruszenia_stwierdzone (odsetki_od_kosztow_kredytowanych, bledne_rrso, bledna_calkowita_kwota_do_zaplaty) <-> hidden_credit_cost_type (undisclosed_commission, misstated_apr, misstated_total_charge)"
    - "standard_oceny_naruszenia <-> unfairness_test_applied (any_nondisclosure vs material / s.140A all-circumstances)"
    - "powod_typ (cesjonariusz_*) <-> claimant_type (claims_management_assignee / litigation_funder)"
    - "pozwany_typ <-> lender_type (motor_finance_lender / bank / broker_dealer)"
    - "wynik_skd <-> outcome (relationship_unfair_remedy_granted / not_unfair / dismissed)"
    - "kwota_zasadzona_pln <-> award_amount_gbp"
    - "zarzut_przedawnienia <-> limitation_defence (Limitation Act 1980 s.9/s.32)"
    - "stosunek_do_c_744_24 <-> treatment_of_johnson_v_firstrand"
