curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date BETWEEN '2022-01-01' AND '2026-11-24'
    AND (
      case_number ~* '(II\s*SAB/|II\s*OSK)'
      OR court_name ~* '(administracyjny)'
    )
    AND (
      full_text ~* '(bezczynno|przewlek)'
      AND full_text ~* '(cudzoziem|pobyt czasowy|pobyt stały|karty pobytu|rezydenta długoterminowego)'
    )
    AND (
      full_text ~* 'wojewod'
      OR full_text ~* 'Urzędu do Spraw Cudzoziemców'
      OR array_to_string(cited_legislation, ' ') ~* 'cudzoziem'
      OR array_to_string(keywords, ' ') ~* '(cudzoziem|bezczynno)'
    )
  ORDER BY decision_date;

filters:
  case_number_patterns: ["II SAB/Wr", "II SAB/Po", "II SAB/Gl", "II SAB/Wa", "II SAB/Kr", "II SAB/Gd", "II SAB/Łd", "II SAB/Lu", "II SAB/Bk", "II SAB/Ol", "II SAB/Sz", "II SAB/Bd", "II SAB/Go", "II SAB/Op", "II SAB/Rz", "II SAB/Ke", "II OSK"]
  case_symbols: ["658 (skargi na bezczynność/przewlekłość)", "619x sprawy cudzoziemców [?]"]
  courts: ["WSA we Wrocławiu", "WSA w Poznaniu", "WSA w Gliwicach", "WSA w Warszawie", "WSA w Krakowie", "WSA w Gdańsku", "WSA w Łodzi", "WSA w Lublinie", "WSA w Białymstoku", "WSA w Olsztynie", "WSA w Szczecinie", "WSA w Bydgoszczy", "WSA w Gorzowie Wielkopolskim", "WSA w Opolu", "WSA w Rzeszowie", "WSA w Kielcach", "Naczelny Sąd Administracyjny"]

