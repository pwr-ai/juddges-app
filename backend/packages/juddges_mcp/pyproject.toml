[project]
name = "juddges_mcp"
version = "0.1.0"
description = "MCP server exposing the Juddges judgment corpus"
authors = [{ name = "Lukasz Augustyniak", email = "aisolutions@lukaszaugustyniak.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "loguru>=0.7.3,<0.8",
    "pydantic>=2.0,<3",
    "mcp==1.30.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
