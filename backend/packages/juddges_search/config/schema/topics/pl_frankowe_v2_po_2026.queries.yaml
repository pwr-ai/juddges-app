topic: pl_frankowe_v2_po_2026
collection:
  name: "Kredyty frankowe 2025–2026 — rozliczenia, przedawnienie, III CZP 8/26"
  description: "Członkowie istniejącej linii orzeczniczej CHF (reasoning line e2fbd45e-e9f8-4588-bc21-f7ed6eb12c5b, ~5090 wyroków, wynik kredytobiorca vs bank z chf_extraction.wynik_sprawy) PLUS wyroki sądów powszechnych z pełnego korpusu z 2025-01-01..2026-11-24 dotyczące rozliczeń po upadku umowy, przedawnienia roszczeń banku, klauzuli NBP+marża, zatrzymania/potrącenia, zabezpieczeń i obsady sądu. Poza zakresem: kredyty złotowe WIBOR, SKD, kredyty w EUR/USD bez CHF."
  jurisdiction: PL
  period: {from: 2025-01-01, to: 2026-11-24}
  size_estimate: "~5090 (istniejąca linia, wszystkie lata) + do ~700 unikalnych z 14 zapytań v2 po 50 (górna granica 14×50, po deduplikacji mniej); unknown dokładnie"
  rationale: "Delta-schemat ma sens na całej linii (można go doekstrahować na 5090 członkach), a uzupełnienie 2025–2026 łapie nowe typy spraw (powództwa banków, przedawnienie) i pozwala porównać okresy przed/po TSUE 16.04.2026 (C-752/24 i in.) oraz przed/po SN III CZP 8/26 (24.06.2026)."

