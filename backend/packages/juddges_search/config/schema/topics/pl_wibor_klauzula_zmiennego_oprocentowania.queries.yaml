topic: pl_wibor_klauzula_zmiennego_oprocentowania
collection:
  name: "Spory o WIBOR w kredytach złotowych (2022-2026)"
  description: "Orzeczenia sądów powszechnych (SR, SO, SA) w sprawach kredytobiorców kwestionujących klauzulę zmiennego oprocentowania opartego na WIBOR, w tym postanowienia o zabezpieczeniu i zawieszeniu. Poza zakresem: kredyty CHF/EUR (LIBOR/EURIBOR), sprawy windykacyjne banku bez zarzutów do WIBOR, sprawy SN (brak w pełnym korpusie)."
  jurisdiction: PL
  period: {from: 2022-01-01, to: 2026-11-24}
  size_estimate: "ok. 1500-3000 orzeczeń w pełnym korpusie [?]: fala pozwów od 2022 r.; doniesienia prasowe o ~420 orzeczeniach w I poł. 2026; publikacja w portalu orzeczeń jest wybiórcza"
  rationale: "Pozwy WIBOR-owe pojawiły się masowo w 2022 r. po gwałtownym wzroście stóp; wyrok TSUE C-471/24 z 12.02.2026 dzieli okres na przed/po, a zawisłe C-586/25, C-630/25, C-607/25 tłumaczą zawieszenia postępowań w 2026 r."

