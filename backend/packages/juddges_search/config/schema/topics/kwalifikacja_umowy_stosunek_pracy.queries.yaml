curated_sql: |
  SELECT id, case_number, court_name, decision_date
  FROM public.judgments
  WHERE jurisdiction = 'PL'
    AND decision_date >= DATE '2015-01-01'
    AND (
      (full_text ~* 'art\.\s*22\s*§\s*1'
        AND full_text ~* '(umow\w*\s+(zlecenia|o\s+dzieło|cywilnopraw\w*|o\s+świadczenie\s+usług)|kontrakt\w*\s+(B2B|menedżersk\w*)|samozatrudni\w*)')
      OR full_text ~* 'ustaleni\w*\s+istnienia\s+stosunku\s+pracy'
      OR full_text ~* 'art\.\s*63\s*(¹|\(1\)|1)\s*k\.\s*p\.\s*c'
      OR (full_text ~* 'umow\w*\s+o\s+dzieło'
          AND full_text ~* '(ubezpiecze\w*\s+społeczn\w*|Zakład\w*\s+Ubezpieczeń\s+Społecznych|organ\w*\s+rentow\w*)')
      OR array_to_string(cited_legislation, ' ') ~* 'art\.?\s*22\s*§\s*1\s*(¹|\(1\)|1|²|\(2\)|2)'
      OR array_to_string(keywords, ' ') ~* '(stosunek\s+pracy|umowa\s+(zlecenia|o\s+dzieło)|samozatrudnienie)'
    )
  ORDER BY decision_date;

uk_side:
  schema: kwalifikacja_umowy_stosunek_pracy_uk.yaml
  curated_sql: |
    SELECT id, case_number, court_name, decision_date
    FROM public.judgments
    WHERE jurisdiction = 'UK'
      AND decision_date >= DATE '2015-01-01'
      AND (
        full_text ~* '(section|s\.)\s*230\s*\(\s*3\s*\)'
        OR full_text ~* 'limb\s*\(?b\)?\s+worker'
        OR full_text ~* '(employment|worker)\s+status'
        OR full_text ~* '(Autoclenz|Pimlico\s+Plumbers|Uber\s+BV|Ready\s+Mixed\s+Concrete|Carmichael\s+v\.?\s+National\s+Power|Professional\s+Game\s+Match\s+Officials)'
        OR full_text ~* '(IR35|intermediaries\s+legislation)'
      )
      AND full_text ~* '(self-employed|independent\s+contractor|contract\s+for\s+services|worker)'
    ORDER BY decision_date;
  notes:
    - "Courts/tribunals: Employment Tribunal (first instance; few reported), EAT, Court of Appeal, UKSC; tax status in FTT (Tax) and Upper Tribunal (Tax and Chancery); CAC and judicial review for union recognition (IWGB). Check which of these the curated UK set actually contains (court_name) before trusting recall."
    - "Terms: employee / worker / limb (b) worker / self-employed / independent contractor / contract of service vs contract for services / mutuality of obligation / substitution clause / sham / business on own account / client or customer / IR35 / deemed employment / hypothetical contract."
    - "No UK analogue of the PL umowa o dzieło vs zlecenie distinction for social security; the closest is a one-off commission (status_determined=defined_deliverable_contractor). The PL ZUS role is split in the UK between HMRC (NICs, PAYE, NMW enforcement) and tribunals."
  field_mapping:
    - "kwalifikacja_umowy_dotyczy <-> employment_status_applies  # tak/nie/niejasne = yes/no/unclear"
    - "tryb_postepowania <-> proceeding_type  # approximate, see value_mapping"
    - "inicjator_sporu <-> initiator  # positional"
    - "rodzaj_umowy_nazwa <-> contract_label  # approximate, see value_mapping"
    - "kwalifikacja_sporna <-> status_contested  # approximate, see value_mapping"
    - "kryteria_wskazujace_na_zatrudnienie <-> criteria_pointing_to_employment  # positional (16 values)"
    - "kryteria_wskazujace_przeciw <-> criteria_pointing_against  # positional (16 values)"
    - "prawo_zastepstwa <-> substitution_right  # positional"
    - "praca_platformowa <-> platform_work  # positional"
    - "dyrektywa_platformowa_powolana <-> (none)  # PL-only"
    - "(none) <-> echr_article_11_considered  # UK-only"
    - "branza <-> sector  # positional (16 values)"
    - "nacisk_umowa_czy_rzeczywistosc <-> contract_vs_reality  # positional"
    - "przepisy_powolane <-> statutory_provisions  # not comparable value-by-value (different statutes)"
    - "wczesniej_umowa_o_prace_ten_sam_podmiot <-> prior_employment_same_engager  # positional"
    - "kwalifikacja_ustalona_przez_sad <-> status_determined  # see value_mapping"
    - "poziom_ochrony <-> protection_tier  # positional; primary cross-lingual outcome comparator"
    - "wynik_dla_wykonawcy <-> outcome_for_individual  # positional"
    - "decyzja_organu_wynik <-> hmrc_determination_outcome  # positional"
    - "konsekwencje <-> consequences  # positional (15 values)"
    - "kwota_zasadzona_pln <-> amount_awarded_gbp  # convert currency before comparing"
    - "kwota_zasadzona_pln_podana <-> amount_awarded_gbp_stated"
    - "okres_spornego_zatrudnienia_miesiace <-> engagement_period_months"
    - "okres_spornego_zatrudnienia_podany <-> engagement_period_stated"
    - "orzeczenia_powolane <-> cited_rulings  # shared CJEU values: Lawrie-Blum, Allonby, FNV Kunsten, Yodel"
    - "traktowanie_orzeczen <-> cited_rulings_treatment  # stosuje/odroznia/polemizuje/nie_dotyczy = applies/distinguishes/disagrees/not_applicable"
  value_mapping:
    tryb_postepowania:
      powodztwo_o_ustalenie_stosunku_pracy_art_189_kpc: status_preliminary_hearing_or_claim
      powodztwo_pip_art_63_1_kpc: regulatory_enforcement
      odwolanie_od_decyzji_pip: regulatory_enforcement
      odwolanie_od_decyzji_zus: tax_status_appeal_ir35_nic
      roszczenia_pracownicze_z_przeslankowa_kwalifikacja: employment_rights_claim_with_status_as_precondition
      sprawa_podatkowa: tax_status_appeal_ir35_nic
      sprawa_wykroczeniowa_art_281_kp: regulatory_enforcement
      inne: other
      nie_podano: not_stated
    rodzaj_umowy_nazwa:
      umowa_zlecenia: casual_or_zero_hours_worker_agreement
      umowa_o_swiadczenie_uslug: contract_for_services_freelance
      umowa_o_dzielo: fixed_deliverable_commission
      kontrakt_b2b_dzialalnosc_gospodarcza: personal_service_company_or_limited_company
      kontrakt_menedzerski: office_holder_or_director_service
      umowa_agencyjna: agency_or_umbrella
      brak_umowy_pisemnej: no_written_contract
      kilka_rodzajow_umow: multiple_labels
      inne: other
      nie_podano: not_stated
    kwalifikacja_sporna:
      stosunek_pracy_czy_umowa_cywilnoprawna: employee_vs_independent_contractor
      stosunek_pracy_czy_samozatrudnienie_b2b: employee_vs_independent_contractor
      dzielo_czy_zlecenie_uslugi: worker_vs_self_employed
      inne: other
      nie_podano: not_stated
    kwalifikacja_ustalona_przez_sad:
      stosunek_pracy: employee
      umowa_zlecenia_uslugi: worker
      umowa_o_dzielo: defined_deliverable_contractor
      samozatrudnienie_b2b: self_employed_independent_contractor
      kwalifikacja_mieszana_okresy: mixed_by_period
      nie_rozstrzygnieto: not_determined
      nie_podano: not_stated
  value_mapping_caveat: "PL umowa zlecenia <-> UK worker is a functional (protection-tier) analogy, not a doctrinal equivalence; compare outcomes via poziom_ochrony <-> protection_tier."

filters:
  case_number_patterns: [" P ", "Pa ", "APa ", " U ", "Ua ", "AUa ", "Pz ", "W "]
  courts:
    - "Sądy rejonowe – wydziały pracy (sygn. P)"
    - "Sądy okręgowe – wydziały pracy i ubezpieczeń społecznych (sygn. P, U, Pa, Ua)"
    - "Sądy apelacyjne – wydziały pracy i ubezpieczeń społecznych (sygn. APa, AUa)"
    - "WSA/NSA – izby finansowe (sprawy art. 5b u.p.d.o.f.; sygn. I SA, II FSK)"
  notes: "Sygnatura 'W' (sprawy wykroczeniowe) tylko w połączeniu z art. 281 k.p.; 'U'/'AUa' to odwołania od decyzji ZUS (spór dzieło/zlecenie i podleganie ubezpieczeniom)."

inclusion_gate: {field: kwalifikacja_umowy_dotyczy, keep: [tak]}
uk_inclusion_gate: {field: employment_status_applies, keep: ["yes"]}
negative_markers:
  - "pozorność umowy o pracę zawartej w celu uzyskania świadczeń (art. 83 k.c.) przy bezspornie pracowniczym tytule"
  - "podstawa wymiaru składek z umowy o pracę (zawyżone wynagrodzenie) bez sporu o rodzaj umowy"
  - "spór o zapłatę wynagrodzenia za dzieło między przedsiębiorcami"
  - "odpowiedzialność pracodawcy za wypadek przy pracy bez sporu o tytuł zatrudnienia"
  - "UK: vicarious liability 'akin to employment' without a statutory status decision"
  - "UK: status conceded by the respondent"

analyses:
  - "Pre/post porównanie: odsetek rozstrzygnięć z poziom_ochrony=pelna_ochrona_pracownicza vs protection_tier=full/partial przed i po Uber v Aslam (19.02.2021) oraz przed i po dyrektywie 2024/2831."
  - "Które kryteria (kryteria_wskazujace_na_zatrudnienie/przeciw) decydują o wyniku w PL vs UK — np. waga prawa zastępstwa i ryzyka gospodarczego; model logistyczny wyniku od kryteriów."
  - "Rola inicjatora: wyniki spraw z inicjatywy ZUS/PIP vs wykonawcy (PL) i HMRC vs worker/union (UK)."
  - "Praca platformowa: liczba i wynik spraw z praca_platformowa=tak w czasie, wg branży."
  - "Linia orzecznicza: częstotliwość powołań III UZP 4/11 i orzeczeń TSUE oraz ich traktowanie (stosuje/odroznia) w kolejnych latach."
