topic: rodo_odszkodowanie_art82
collection:
  name: "RODO art. 82 – odszkodowanie i zadośćuczynienie oraz kontrola kar UODO (PL + UK)"
  description: "PL: sprawy sądów powszechnych o odszkodowanie/zadośćuczynienie za naruszenie RODO (art. 82 RODO, art. 92 u.o.d.o., art. 23, 24, 448 k.c.) oraz sprawy WSA w Warszawie i NSA ze skarg na decyzje Prezesa UODO, w tym administracyjne kary pieniężne (art. 83 RODO, art. 102 u.o.d.o.). UK: compensation claims under UK GDPR art. 82 / DPA 2018 s.168-169 (incl. combined MPI claims, representative/group actions) and reviews of ICO penalties. Poza zakresem: anonimizacja orzeczeń, dostęp do informacji publicznej, ochrona dóbr osobistych bez przetwarzania danych."
  jurisdiction: PL+UK
  period: {from: 2019-01-01, to: 2026-11-24}
  size_estimate: "unknown; rough guess: low thousands of PL candidates in the full corpus (RODO is mentioned in many unrelated cases), of which a few hundred pass the gate; up to ~800 candidates from the 16 queries below (limit 50 each). Curated: tens PL, tens UK."
  rationale: "RODO stosowane od 25.05.2018; pierwsze wyroki merytoryczne od 2019 r. Okres obejmuje stan przed i po C-300/21 (4.05.2023) oraz serii orzeczeń TSUE 2023–2024 (C-340/21, C-687/21, C-741/21, C-590/22, C-200/23), co pozwala badać wpływ na próg szkody w sądach polskich; w UK – przed i po Farley v Paymaster [2025] EWCA Civ 1117 (22.08.2025) i ewentualnym wyroku UKSC. UK side starts 2015 (Vidal-Hall) because Lloyd v Google concerned DPA 1998."

